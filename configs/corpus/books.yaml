# Phase 3 IKS corpus — book registry. Pipeline reads entries with
# ``status: ready`` (local Tesseract OCR) and ``status: ready_external``
# (text-source supplied by external OCR, e.g. Gemini). Adding a new book
# = adding an entry here; no code change required. Master plan §15.
#
# Two books processed by Phase 3 (Tesseract); two more (Krishi Parashara,
# Upavanavinoda) registered for external Gemini OCR via Phase 3b — they
# come online when their ``text_source`` markdown file lands in
# ``corpus/ocr_external/``.

books:
  - id: vrikshayurveda
    title: Vrikshayurveda
    author: Surapala
    translator: Nalini Sadhale
    edition: "Asian Agri-History Foundation, 1996"
    original_language: Sanskrit
    pdf: data/corpus_pdfs/Vriksha_Ayurveda_of_Surapala_Nalini_Sadhale_1996.pdf
    status: ready
    # ``full`` => OCR every page; chapter detection falls back to
    # numbered sections / sequential blocks.
    scope: full
    default_topic_tags: [plant_care, horticulture, kunapajala, pest_control]

  - id: brihat_samhita
    title: Brihat Samhita
    author: Varahamihira
    translator: M. Ramakrishna Bhat
    edition: "Motilal Banarsidass (MLBD), Part 1"
    original_language: Sanskrit
    pdf: data/corpus_pdfs/Brihat_Samhita_with_English_Translation_Ramakrishna_Bhatt_M__Part_1_MLBD.pdf
    status: ready
    # ``chapters`` => OCR every page but only KEEP / chunk the chapters
    # listed under ``chapters:``. Chapters are located by English
    # heading text (also matches Roman-numeral forms), so the
    # PDF-page <-> printed-page offset drift in this book (~8 near
    # the front, ~45 near the end) is harmless.
    scope: chapters
    chapters: [21, 22, 23, 24, 25, 26, 27, 28, 29, 40, 54, 55]
    chapter_titles:
      21: "Pregnancy of Clouds"
      22: "Retention of Embryo"
      23: "Rainfall"
      24: "Conjunction with Rohini"
      25: "Conjunction with Svati"
      26: "Conjunction with Asadha"
      27: "Wind Circle"
      28: "Signs of Immediate Rain"
      29: "Prognostics from Flowers and Creepers"
      40: "Growth of Crops"
      54: "Exploration of Water Springs"
      55: "Treatment of Trees"
    default_topic_tags: [rainfall, weather_prediction, water_divination, crops, tree_treatment]

  # Phase 3b: registered for external Gemini OCR. The pipeline skips
  # these books with a clear log line until their ``text_source``
  # markdown file lands in ``corpus/ocr_external/``. PDF page ranges
  # below were verified manually to bracket the English-translation
  # block only; treat as ±1 page and refine at ingest if needed.
  - id: krishi_parashara
    title: Krishi Parashara
    author: Parashara
    translator: Girija Prasanna Majumdar & Sures Chandra Banerji
    edition: "Bibliotheca Indica, Work No. 285, 1960"
    original_language: Sanskrit
    pdf: data/corpus_pdfs/KrishiParasara-GirijaPrasannaMajumdarScBanerji1960bis.pdf
    status: ready_external
    ocr_method: gemini_external
    scope: pages
    page_range: [94, 119]
    text_source: corpus/ocr_external/krishi_parashara.md
    exclude_note: "English translation only = PDF p.94-119. Skip: roman intro 1-28, Devanagari text 29-93, Sanskrit notes+glossary 120-160."
    note: "Majumdar edition; verse numbering follows Majumdar, not AAHF. Translation is a contiguous English block."
    default_topic_tags: [rainfall, sowing, seed_preservation, cattle, agricultural_calendar, omens]

  - id: upavanavinoda
    title: Upavanavinoda
    author: Sarngadhara
    translator: Girija Prasanna Majumdar
    edition: "Indian Research Institute, Indian Positive Sciences Series No. 1"
    original_language: Sanskrit
    pdf: data/corpus_pdfs/2015.282467.Upavana-Vinoda.pdf
    status: ready_external
    ocr_method: gemini_external
    scope: pages
    page_range: [77, 96]
    text_source: corpus/ocr_external/upavanavinoda.md
    exclude_note: "English translation only = PDF p.77-96 (divider 'THE TRANSLATION' at p.75). Skip: front matter 1-9, modern essay 'Science of Arbori-Horticulture' 10-73, Sanskrit appendix 97-134."
    note: "Arbori-horticulture text. Majumdar edition; verse numbering follows Majumdar, not AAHF. Translation is a contiguous English block."
    default_topic_tags: [arboriculture, tree_planting, grafting, plant_protection, soil_preparation, watering]

  # Pending placeholders — drop a PDF in, fill the metadata, flip status
  # to ``ready`` (or ``ready_external`` for Gemini-OCR'd books) and
  # re-run ``python -m src.rag.corpus.build_corpus``. No code change.
  - id: kashyapiyakrishisukti
    title: Kashyapiya Krishisukti
    author: Kashyapa
    translator: "Gemini Flash 3.6 (Sanskrit->English), verse-level"
    edition: "Sanskrit mula (root text); OCR+translated 2026-08"
    original_language: Sanskrit
    pdf: 512447135-Kakayapiya-Krishi-Sukti-of-Kashyapa.pdf
    status: ready_external
    ocr_method: gemini_external
    scope: pages
    page_range: [1, 64]
    text_source: corpus/ocr_external/kashyapiyakrishisukti.md
    note: "Sanskrit-only scan; each verse OCR'd + translated to English by Gemini Flash 3.6. Cultivation-focused (soil/water/seed/sowing); light on disease-treatment. text_source holds the English translation only (Sanskrit kept in sanskrit_ocr_demo/)."
    default_topic_tags: [soil_selection, water_management, seed_preservation, sowing, cultivation, grain]
  # Majumdar's own English essay that opens the Upavanavinoda volume (book pp.1-33,
  # PDF pp.9-42) -- "The Science of Arbori-Horticulture in Ancient India". Phase 3b
  # deliberately skipped it as a "modern essay", but it is English prose that quotes
  # and TRANSLATES further classical verses (e.g. water-divining by plant
  # indicators), so it is usable content we already owned but never indexed.
  #
  # Registered SEPARATELY from ``upavanavinoda`` rather than appended to it: this is
  # the 1935 editor's commentary, not Sarngadhara's text, and a citation must not
  # imply otherwise. Hence ``source_tier: scholarly_commentary``.
  - id: upavanavinoda_introduction
    title: "Upavanavinoda - Introduction: The Science of Arbori-Horticulture in Ancient India"
    author: Girija Prasanna Majumdar
    translator: Girija Prasanna Majumdar
    edition: "Indian Research Institute, Indian Positive Sciences Series No. 1, 1935"
    original_language: English
    pdf: data/corpus_pdfs/2015.282467.Upavana-Vinoda.pdf
    status: ready_external
    ocr_method: gemini_external
    source_tier: scholarly_commentary
    scope: pages
    page_range: [9, 42]
    text_source: corpus/ocr_external/upavanavinoda_introduction.md
    exclude_note: "Introduction only (book pp.1-33 = PDF pp.9-42). The Sanskrit text (PDF 45-73), the translation (77-96, indexed as `upavanavinoda`), the Sanskrit appendix (99-121) and the plant list are not included here."
    note: "Editor's scholarly essay, not the classical text itself -- tiered as scholarly_commentary. OCR'd at 150 DPI: this scan is ~690KB/page and 220 DPI made each Gemini call take minutes."
    default_topic_tags: [arboriculture, plant_science, water_divination, soil, ancient_india]

  # Modern IKS-derived practice (NOT a classical treatise). Tiered separately via
  # ``source_tier`` so a citation always tells the reader whether the advice came
  # from a classical text or from contemporary IKS-derived guidance, and the
  # thesis's "grounded in classical texts" claim stays honest.
  #
  # Rationale: Phase 11 showed corpus COVERAGE is the limiter (~55% over-refusal on
  # answerable queries) because the classical texts are thin on symptom -> remedy.
  # This manual supplies that layer in structured form (Purpose / Ingredients /
  # Preparation / Application) and is itself IKS-rooted (cow dung, cow urine, neem
  # -- the kunapajala tradition). Clean text layer, so no OCR was needed.
  # Advisory chapters only: 2, 4, 5, 6.1-6.2, 8 (see scripts/extract_niti_manual.py).
  - id: niti_natural_farming
    title: "Empowering Farmers: Natural Farming Training Toolkit and Best Practices Guide"
    author: "Neelam Patel, Paremal Banafarr, Somnath Choudhary et al."
    translator: ""
    edition: "NITI Aayog, Government of India, February 2026, ISBN 978-81-991080-0-4"
    original_language: English
    pdf: newbooks/Training-Manual-English.pdf
    status: ready_external
    ocr_method: text_layer
    source_tier: modern_iks
    scope: pages
    page_range: [36, 165]
    text_source: corpus/ocr_external/niti_natural_farming.md
    exclude_note: "Advisory chapters only. Ingested: Ch2 seed (36-43), Ch4 soil (60-65), Ch5 pest+disease (66-77), Ch6.1-6.2 bio-inputs (78-92), Ch8 key crops (112-165). Skipped: Ch1 theory, Ch3 water, Ch6.3-6.4 BRC infrastructure+schemes (93-103), Ch7 certification, Ch9 carbon credits, Ch10-11 frameworks/schemes."
    note: "Modern government publication, not a classical treatise -- tiered as modern_iks. Sections are emitted one per block so formulations (Jeevamrit, Beejamrit, Neemastra, Brahmastra, Agniastra, Dashaparni) stay intact through chunking."
    default_topic_tags: [pest_control, disease_management, bio_inputs, seed_treatment, soil_health, natural_farming]

  - id: vishvavallabha
    title: Vishvavallabha
    author: Chakrapani Mishra (c. 1577, court of Maharana Pratap, Mewar)
    translator: Nalini Sadhale
    edition: "Asian Agri-History Foundation, Agri-History Bulletin No. 5, 2004 (commentaries by N. Sadhale and Y. L. Nene)"
    original_language: Sanskrit
    pdf: newbooks/vishvavallabha/Vishvavallabha_Sadhale_AAHF2004.pdf
    status: ready_external
    ocr_method: text_layer
    source_tier: classical
    scope: pages
    page_range: [55, 92]
    text_source: corpus/ocr_external/vishvavallabha.md
    split_chapters: true
    note: >-
      The sixth treatise of the master plan (was text_six_tbd). Obtained 2026-09-26 from the
      Internet Archive (item visvavallabha-nalini-s-ed.), the AAHF edition itself. English
      translation only, prepared from archive.org's OCR by scripts/prepare_vishvavallabha.py
      - no Gemini, no cost. Chapters split 1A-1E (chapter I's five parts) and 2-9 because
      verse numbering restarts in each. Chapter 8, Diseases and treatment, is 79 verses - the
      largest in the book and the disease layer the other treatises lack. See 6q.
    default_topic_tags:
      - groundwater
      - water_reservoirs
      - soil_examination
      - propagation
      - plant_care
      - nourishment
      - plant_disease
      - treatment
